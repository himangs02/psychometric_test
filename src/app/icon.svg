<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="northGrad" x1="32" y1="12" x2="48" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)"/>
  
  <!-- Outer Compass Ring -->
  <circle cx="32" cy="32" r="23" stroke="#93C5FD" stroke-width="2.5" stroke-opacity="0.5"/>
  
  <!-- Cardinal Tick Marks -->
  <line x1="32" y1="12" x2="32" y2="16" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="48" y2="32" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="32" y1="52" x2="32" y2="48" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="12" y1="32" x2="16" y2="32" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Compass Needle (Angled at 45° like Lucide Compass) -->
  <!-- North Needle Tip (Vibrant Orange/Coral) -->
  <polygon points="46,18 36.5,27.5 32,32 27.5,36.5 32,23" fill="url(#northGrad)"/>
  
  <!-- South Needle Tip (Clean White) -->
  <polygon points="18,46 27.5,36.5 32,32 36.5,27.5 23,32" fill="#FFFFFF"/>

  <!-- Needle Center Shading -->
  <polygon points="46,18 32,32 27.5,36.5" fill="#FF5A1F"/>
  <polygon points="18,46 32,32 36.5,27.5" fill="#E2E8F0"/>

  <!-- Center Pivot -->
  <circle cx="32" cy="32" r="4" fill="#0F172A"/>
  <circle cx="32" cy="32" r="2" fill="#FFFFFF"/>
</svg>
